<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modèle 3D</title>
  <script type="module" src="model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#f0f0f0; font-family:sans-serif; }
    model-viewer { width:100%; height:80%; display:block; }
    #log { padding:10px; font-size:14px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="15_08_2026-v1.glb"
    alt="Modèle 3D"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
  </model-viewer>
  <div id="log"></div>

  <script>
    const log = document.getElementById('log');
    const mv  = document.getElementById('mv');
    let lines = [];
    const show = () => log.textContent = lines.join('\n');

    const gl = document.createElement('canvas').getContext('webgl2')
            || document.createElement('canvas').getContext('webgl');
    lines.push(gl ? 'WebGL : OK' : 'WebGL : INDISPONIBLE');
    lines.push('Composant : en attente…');
    show();

    const t0 = Date.now();
    customElements.whenDefined('model-viewer').then(() => {
      lines[1] = 'Composant : enregistré après ' + (Date.now() - t0) + ' ms';
      show();
    });
    setTimeout(() => {
      if (!customElements.get('model-viewer')) {
        lines[1] = 'Composant : TOUJOURS absent après 15 s';
        show();
      }
    }, 15000);

    mv.addEventListener('load',  () => { lines.push('Modèle : chargé'); show(); });
    mv.addEventListener('error', e => { lines.push('Erreur modèle : ' + JSON.stringify(e.detail)); show(); });
    window.addEventListener('error', e => {
      const cible = e.target && e.target.src ? e.target.src : ('script: ' + e.message);
      lines.push('Échec de chargement → ' + cible);
      show();
    }, true);
  </script>
</body>
</html>
