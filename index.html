<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modèles 3D</title>
  <script type="module" src="model-viewer.min.js"></script>
  <style>
    body { margin:0; padding:16px; background:#f0f0f0; font-family:sans-serif; }
    model-viewer { width:100%; height:60vh; display:block; background:#f7f7f7; border-radius:8px; }
    .onglets { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .onglets button { padding:8px 14px; border:0; border-radius:20px; background:#fff; cursor:pointer; font-size:14px; }
    .onglets button.actif { background:#333; color:#fff; }
  </style>
</head>
<body>
  <model-viewer id="mv" src="15_08_2026-v1.glb" alt="Modèle 3D"
    camera-controls touch-action="pan-y" shadow-intensity="1"
    environment-image="neutral"></model-viewer>

  <div class="onglets" id="onglets"></div>

  <script>
    const modeles = [
      { nom: 'Modèle A', fichier: '15_08_2026-v1.glb' },
      { nom: 'Modèle B', fichier: 'modele-2.glb' },
      { nom: 'Modèle C', fichier: 'modele-3.glb' }
    ];

    const mv = document.getElementById('mv');
    const barre = document.getElementById('onglets');

    modeles.forEach((m, i) => {
      const b = document.createElement('button');
      b.textContent = m.nom;
      if (i === 0) b.classList.add('actif');
      b.onclick = () => {
        mv.src = m.fichier;
        barre.querySelectorAll('button').forEach(x => x.classList.remove('actif'));
        b.classList.add('actif');
      };
      barre.appendChild(b);
    });
  </script>
</body>
</html>
